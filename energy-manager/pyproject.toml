[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-manager"
version = "0.5.0"
description = "Universeel, vooruitkijkend Energy Management System voor Raspberry Pi / Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "tzdata",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42",
    "zeroconf>=0.130",
    "websockets>=13",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyserial>=3.5",
    "aiomqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout", "ruff"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
ems = "ems.__main__:main"
ems-sim = "ems.simulator.__main__:main"

[project.entry-points."ems.drivers"]
# Third-party driver packages register here, e.g.:
# my_vendor = "my_package.driver_module"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
ems = ["CHANGELOG.md", "web/*", "web/css/*", "web/js/*.js", "web/js/views/*.js"]
"ems.integrations.homewizard" = ["*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 130
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ems", "conftest"]
known-third-party = ["emcloud"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.params.Depends"]
