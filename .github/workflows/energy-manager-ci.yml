name: Energy Manager — tests and Raspberry Pi image

on:
  push:
    paths:
      - "energy-manager/**"
      - ".github/workflows/energy-manager-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: energy-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q mosquitto mosquitto-clients   # real broker for the MQTT driver test
      - run: python -m pip install ".[dev]"
      - run: ruff check backend tests
      - run: python -m pytest -q --timeout 300 -p no:warnings
      - run: ems selftest
      - name: Live check of the EnergyZero price source (external service; informative)
        continue-on-error: true
        run: |
          python - <<'PY'
          import asyncio
          from datetime import UTC, datetime, timedelta
          from ems.prices.providers import EnergyZeroProvider
          async def main():
              now = datetime.now(UTC)
              for interval in ("quarter", "hour"):
                  prov = EnergyZeroProvider(interval)
                  pts = await prov.fetch(now - timedelta(hours=12), now + timedelta(hours=36))
                  print(interval, "points:", len(pts), "endpoint:", prov._endpoint)
                  for p in pts[:3] + pts[-2:]:
                      print("  ", p.start.isoformat(), p.price_eur_kwh, "EUR/kWh", p.resolution_min, "min")
                  assert pts, "no prices"
          asyncio.run(main())
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 + arm64 (Raspberry Pi 4/5)
        uses: docker/build-push-action@v6
        with:
          context: energy-manager
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image
        uses: docker/build-push-action@v6
        with:
          context: energy-manager
          load: true
          tags: energy-manager:ci
          cache-from: type=gha
      - name: Container selftest and health check
        run: |
          docker run --rm energy-manager:ci ems selftest
          docker run -d --name ems -e EMS_MODE=demo -p 8080:8080 energy-manager:ci
          for i in $(seq 1 60); do curl -fs localhost:8080/healthz && break; sleep 2; done
          curl -fs localhost:8080/healthz
          docker logs ems | tail -20
