name: Energy Manager — tests and Raspberry Pi image

on:
  push:
    paths:
      - "energy-manager/**"
      - ".github/workflows/energy-manager-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: energy-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q mosquitto mosquitto-clients   # real broker for the MQTT driver test
      - run: python -m pip install ".[dev]" "./cloud[dev]"
      - run: ruff check backend tests tools cloud
      - run: python -m pytest -q --timeout 300 -p no:warnings
      - name: Cloud tests (SQLite)
        working-directory: energy-manager/cloud
        run: python -m pytest -q -p no:warnings
      - run: ems selftest
      - name: Live check of the EnergyZero price source (external service; informative)
        continue-on-error: true
        run: |
          python - <<'PY'
          import asyncio
          from datetime import UTC, datetime, timedelta
          import httpx
          from ems.prices.providers import ENERGYZERO_URL, EnergyZeroProvider, validate_points
          from ems.prices.service import PriceService
          async def main():
              now = datetime.now(UTC)
              # 1. Raw schema of the official endpoint (documented parameters only).
              day = now.astimezone(__import__("zoneinfo").ZoneInfo("Europe/Amsterdam")).strftime("%d-%m-%Y")
              r = httpx.get(ENERGYZERO_URL, params={"date": day, "interval": "INTERVAL_QUARTER",
                                                    "energy_type": "ENERGY_TYPE_ELECTRICITY"}, timeout=20)
              print("HTTP", r.status_code, "top-level keys:", sorted(r.json()) if r.status_code == 200 else r.text[:200])
              doc = r.json()
              assert "base" in doc and isinstance(doc["base"], list) and doc["base"], "schema: 'base' list missing"
              item = doc["base"][0]
              print("item keys:", sorted(item), "price keys:", sorted(item["price"]))
              assert {"start", "end", "price"} <= set(item) and "value" in item["price"], "schema changed"
              # 2. Provider + validation + coverage, both intervals.
              for interval in ("quarter", "hour"):
                  prov = EnergyZeroProvider(interval)
                  svc = PriceService(None, "NL", prov)
                  n = await svc.refresh(now)
                  pts, problems = validate_points(await prov.fetch(now - timedelta(hours=12), now + timedelta(hours=36)))
                  st = svc.status(now)
                  print(interval, "stored:", n, "valid:", len(pts), "rejected:", len(problems), "meta:", prov.last_meta)
                  print("  today:", st["coverage"].get("today", {}).get("known"), "/", st["coverage"].get("today", {}).get("intervals"),
                        "tomorrow:", st["publication"]["state"])
                  assert n and pts and not problems, "no (valid) prices"
                  assert st["coverage"]["today"]["complete"], "today incomplete"
          asyncio.run(main())
          PY

  cloud-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emc
          POSTGRES_PASSWORD: emc-test-pw
          POSTGRES_DB: emctest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emc -d emctest" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: energy-manager/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,postgres]"
      - name: Cloud tests on PostgreSQL 16
        env:
          EMC_TEST_DATABASE_URL: postgresql+psycopg://emc:emc-test-pw@127.0.0.1:5432/emctest
        run: python -m pytest -q -p no:warnings
      - name: Cloud image builds and starts (production checks refuse an incomplete configuration)
        run: |
          docker build -t energy-manager-cloud:ci .
          if docker run --rm -e EMC_ENV=production energy-manager-cloud:ci; then echo "production start without settings must fail"; exit 1; fi
          docker run -d --name emc2 --network host -e EMC_DATABASE_URL=postgresql+psycopg://emc:emc-test-pw@127.0.0.1:5432/emctest energy-manager-cloud:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8800/api/v1/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8800/api/v1/health | grep '"ok"'

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 + arm64 (Raspberry Pi 4/5)
        uses: docker/build-push-action@v6
        with:
          context: energy-manager
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image
        uses: docker/build-push-action@v6
        with:
          context: energy-manager
          load: true
          tags: energy-manager:ci
          cache-from: type=gha
      - name: Container selftest and health check
        run: |
          docker run --rm energy-manager:ci ems selftest
          docker run -d --name ems -e EMS_MODE=demo -p 8080:8080 energy-manager:ci
          for i in $(seq 1 60); do curl -fs localhost:8080/healthz && break; sleep 2; done
          curl -fs localhost:8080/healthz
          docker logs ems | tail -20
          docker rm -f ems
      - name: Linux acceptance (Docker amd64)
        run: energy-manager/deploy/acceptance-linux.sh docker energy-manager:ci linux/amd64
      - name: Load arm64 image (Raspberry Pi 4/5)
        uses: docker/build-push-action@v6
        with:
          context: energy-manager
          platforms: linux/arm64
          load: true
          tags: energy-manager:ci-arm64
          cache-from: type=gha
      - name: Raspberry Pi acceptance (Docker arm64 under QEMU emulation — no physical Pi)
        run: energy-manager/deploy/acceptance-linux.sh docker energy-manager:ci-arm64 linux/arm64

  linux-native:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: energy-manager
    steps:
      - uses: actions/checkout@v4
      - name: Native install with systemd unit (Ubuntu) — restart, crash recovery, reinstall
        run: ./deploy/acceptance-linux.sh systemd
