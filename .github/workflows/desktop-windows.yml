# Builds the Audio OnAir Turbo Windows installer on a real Windows machine and puts
# every new version on the updates page (GitHub Releases, tag v<version>), where it
# can be downloaded without logging in. The app itself checks that page for updates.
name: Audio OnAir Turbo Database – Windows installer

on:
  workflow_dispatch:
  push:
    branches: [audio-vault]
    paths: ['audio-vault/desktop/**', 'audio-vault/src/**', 'audio-vault/public/**', 'audio-vault/Dockerfile', 'audio-vault/docker-compose*.yml', 'audio-vault/converter/**', 'audio-vault/src/convert-archive.js', '.github/workflows/desktop-windows.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: audio-vault/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audio-vault/desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-OnAir-Turbo-Database-Setup
          path: audio-vault/desktop/dist/*.exe
          if-no-files-found: error
      - name: Publish on the updates page
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./audio-vault/desktop/package.json').version")
          TAG="v$VERSION"
          NOTES="Installeren: download Audio-OnAir-Turbo-Database-Setup-$VERSION.exe en start het, of klik in de studio op het ⬆-icoon. Instellingen, databases en muziek blijven staan."$'\n\n'"Laatste wijziging: $(git log -1 --format=%s)"
          # Each build adds its own files; whichever finishes first creates the release.
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" audio-vault/desktop/dist/*.exe --clobber && exit 0
            else
              gh release create "$TAG" audio-vault/desktop/dist/*.exe --target "${{ github.sha }}" --title "Audio OnAir Turbo Database $VERSION" --notes "$NOTES" --latest && exit 0
            fi
            sleep 10
          done
          exit 1

  # Standalone "Audio OnAir Turbo Omzetter" (WAV → FLAC), installer + single exe.
  converter:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: audio-vault/converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audio-vault/converter/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-OnAir-Turbo-Database-Omzetter
          path: audio-vault/converter/dist/*.exe
          if-no-files-found: error
      - name: Publish on the updates page
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./audio-vault/desktop/package.json').version")
          TAG="v$VERSION"
          NOTES="Installeren: download Audio-OnAir-Turbo-Database-Setup-$VERSION.exe en start het, of klik in de studio op het ⬆-icoon. Instellingen, databases en muziek blijven staan."$'\n\n'"Laatste wijziging: $(git log -1 --format=%s)"
          # Each build adds its own files; whichever finishes first creates the release.
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" audio-vault/converter/dist/*.exe --clobber && exit 0
            else
              gh release create "$TAG" audio-vault/converter/dist/*.exe --target "${{ github.sha }}" --title "Audio OnAir Turbo Database $VERSION" --notes "$NOTES" --latest && exit 0
            fi
            sleep 10
          done
          exit 1

