name: Energy Manager — Windows installer

on:
  push:
    paths:
      - "energy-manager/**"
      - ".github/workflows/energy-manager-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # publish the download link (release asset)
    defaults:
      run:
        shell: pwsh
        working-directory: energy-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: energy-manager/windows-app/src-tauri -> target

      - name: Install Python packages
        run: python -m pip install ".[dev]" pyinstaller

      - name: Tests (Windows)
        run: python -m pytest -q --timeout 300 -p no:warnings

      - name: Build EMS server (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build windows/EnergyManagerServer.spec

      - name: Server selftest
        run: |
          .\dist\EnergyManagerServer\EnergyManagerServer.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "server selftest failed" }

      - name: All-in-one server - background start, query, graceful stop (as the app does)
        run: |
          $svc = ".\dist\EnergyManagerServer\EnergyManagerService.exe"
          $p = Start-Process -FilePath $svc -ArgumentList "--background","--demo" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/v1/system/info -Headers @{Origin="http://tauri.localhost"}; $ok = $true; break } catch { }
          }
          Get-Content "$env:LOCALAPPDATA\EnergyManager\logs\server.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $ok) { throw "background server did not answer on 127.0.0.1:8080 (exited: $($p.HasExited))" }
          Write-Host $r.Content
          if ($r.Headers['access-control-allow-origin'] -ne "http://tauri.localhost") { throw "CORS header missing for the app" }
          if (-not ($r.Content -match '"mode":"demo"')) { throw "server not in demo mode" }
          if (-not (Test-Path "$env:LOCALAPPDATA\EnergyManager\control.txt")) { throw "control file missing" }
          .\dist\EnergyManagerServer\EnergyManagerServer.exe --stop
          if ($LASTEXITCODE -ne 0) { throw "stop failed" }
          if (-not $p.WaitForExit(30000)) { throw "server process did not exit after stop" }
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "server exited with $($p.ExitCode)" }
          if (Test-Path "$env:LOCALAPPDATA\EnergyManager\control.txt") { throw "control file not removed" }

      - name: Build Windows app (Tauri)
        working-directory: energy-manager/windows-app
        run: |
          npm install --no-audit --no-fund
          npx tauri icon app-icon.png
          npx tauri build --no-bundle
          New-Item -ItemType Directory -Force ..\dist\app | Out-Null
          Copy-Item "src-tauri\target\release\energy-manager.exe" "..\dist\app\Energy Manager.exe" -Force

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (python -c "import ems; print(ems.__version__)").Trim()
          & $iscc "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      # Authenticode signing is prepared but only runs when a certificate is configured as
      # repository secrets (WINDOWS_SIGNING_PFX_BASE64 + WINDOWS_SIGNING_PASSWORD). Without one the
      # build is reported as an UNSIGNED DEVELOPMENT BUILD — never faked.
      - name: Code signing (only with a configured certificate)
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "UNSIGNED DEVELOPMENT BUILD (no signing certificate configured)"; "unsigned" | Set-Content dist\signing.txt; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\EnergyManagerSetup-*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          "signed" | Set-Content dist\signing.txt
          Remove-Item $pfx

      - name: Windows acceptance test (install, run, restart, upgrade, uninstall)
        run: |
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\EnergyManager" -ErrorAction SilentlyContinue
          $exe = (Get-ChildItem dist\EnergyManagerSetup-*.exe | Select-Object -First 1).FullName
          .\windows\acceptance.ps1 -Installer $exe
          Copy-Item acceptance-results.txt dist\acceptance-results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EnergyManager-Windows
          path: |
            energy-manager/dist/EnergyManagerSetup-*.exe
            energy-manager/dist/acceptance-results.txt
          if-no-files-found: error

      # Direct download link that always points to the newest build:
      # https://github.com/<owner>/<repo>/releases/download/energy-manager-windows/EnergyManagerSetup.exe
      - name: Publish download link (rolling pre-release)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/energy-manager-phase1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist\EnergyManagerSetup-*.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist\EnergyManagerSetup.exe -Force
          $tag = "energy-manager-windows"
          $notes = "Nieuwste Windows-installer van Energy Manager (app + ingebouwde EMS-server, geen Raspberry Pi nodig).`n`n" +
                   "Download **EnergyManagerSetup.exe** hieronder en start het. Windows meldt mogelijk 'Onbekende uitgever' " +
                   "(nog niet ondertekend): Meer informatie -> Toch uitvoeren.`n`nGebouwd uit commit $env:GITHUB_SHA ($(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC)." +
                   "`n`nVersie: $((python -c 'import ems; print(ems.__version__)').Trim()) - $((Get-Content dist\signing.txt) -eq 'signed' ? 'ondertekend' : 'UNSIGNED DEVELOPMENT BUILD')" +
                   "`n`nWindows-acceptatietest:`n" + ((Get-Content dist\acceptance-results.txt | ForEach-Object { "- $_" }) -join "`n")
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "Energy Manager voor Windows (nieuwste versie)" --notes $notes --target $env:GITHUB_SHA
          } else {
            gh release edit $tag --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "release create/edit failed" }
          gh release upload $tag dist\EnergyManagerSetup.exe dist\acceptance-results.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
