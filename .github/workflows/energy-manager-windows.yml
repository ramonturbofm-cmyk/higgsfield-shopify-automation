name: Energy Manager — Windows build

on:
  push:
    paths:
      - "energy-manager/**"
      - ".github/workflows/energy-manager-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: energy-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest pytest-asyncio

      - name: Tests (on Windows)
        run: python -m pytest -q

      - name: Build EnergyManager.exe
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build windows/EnergyManager.spec

      - name: Smoke test exe
        run: |
          .\dist\EnergyManager.exe --selftest --data-dir "$env:RUNNER_TEMP\ems-selftest"
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (python -c "import ems; print(ems.__version__)").Trim()
          & $iscc "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: EnergyManager-Windows
          path: |
            energy-manager/dist/EnergyManager-Setup-*.exe
            energy-manager/dist/EnergyManager.exe
          if-no-files-found: error
