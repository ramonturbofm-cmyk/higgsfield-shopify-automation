# Audio OnAir Turbo on a Synology (Container Manager → Project) or any Docker host.
# Fill in the values in a file called .env next to this file (see docker.env.example).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: onair
      POSTGRES_PASSWORD: ${DB_PASSWORD:?zet DB_PASSWORD in .env}
      POSTGRES_DB: onair
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onair"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://onair:${DB_PASSWORD}@db:5432/onair
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:?zet SESSION_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1000}
    volumes:
      - ./data/audio:/data
      # Your existing music folder, read-only, for `npm run import`.
      - ${MUSIC_DIR:-./import}:/import:ro
    ports:
      - "${PORT:-3000}:3000"

  # Daily backup of database + audio (see backup/backup.sh). Target: BACKUP_DIR,
  # or the NAS with docker-compose.nas-backup.yml.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Europe/Amsterdam
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./data/audio:/data:ro
      - ${BACKUP_DIR:-./data/backup}:/backup

  # "Archief omzetten": converts the music archive (WAV) to FLAC in a NEW folder.
  # Only runs when started on purpose:  docker compose --profile archief up -d archive
  archive:
    build: .
    profiles: ["archief"]
    restart: "no"
    init: true
    entrypoint: ["node", "src/convert-archive.js", "/bron", "/doel", "--jobs", "${ARCHIVE_JOBS:-3}"]
    volumes:
      - ${MUSIC_DIR:-./import}:/bron:ro
      - ${ARCHIVE_DIR:-./data/archief}:/doel
